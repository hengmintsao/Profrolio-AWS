name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing annotated vX.Y.Z tag reachable from main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Resolve release source
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/resolve-release.mjs

  checks:
    needs: resolve
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  deploy:
    needs: [resolve, checks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: ${{ vars.SAM_STACK_NAME || 'portfolio-aws' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - name: Check deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo '::error::Set AWS_ROLE_ARN and configure its GitHub OIDC trust for the production environment.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: node scripts/resolve-release.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deployment-inputs-${{ needs.resolve.outputs.source_sha }}-${{ github.run_attempt }}
      - name: Verify and restore validated inputs
        run: |
          sha256sum --check deployment-inputs.sha256
          tar -xzf deployment-inputs.tgz
      - name: Deploy infrastructure
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          parameters=()
          if [ -n "$NOTIFICATION_EMAIL" ]; then
            parameters=(--parameter-overrides "NotificationEmail=$NOTIFICATION_EMAIL")
          fi
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            "${parameters[@]}"
      - name: Read stack outputs
        id: stack
        shell: bash
        run: |
          outputs=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output json)
          echo "api_url=$(jq -r '.[] | select(.OutputKey=="ApiEndpoint").OutputValue' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "bucket=$(jq -r '.[] | select(.OutputKey=="FrontendBucketName").OutputValue' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "distribution=$(jq -r '.[] | select(.OutputKey=="DistributionId").OutputValue' <<< "$outputs")" >> "$GITHUB_OUTPUT"
      - name: Inject runtime configuration
        shell: bash
        env:
          API_URL: ${{ steps.stack.outputs.api_url }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; const url = new URL(process.env.API_URL); if (url.protocol !== "https:") throw new Error("HTTPS API required"); writeFileSync("frontend/js/config.js", `window.APP_CONFIG = ${JSON.stringify({ API_URL: url.href })};\n`);'
      - name: Publish frontend
        run: aws s3 sync frontend/ "s3://${{ steps.stack.outputs.bucket }}" --delete
      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.stack.outputs.distribution }}" --paths '/*'

      - name: Record deployment source
        if: ${{ always() }}
        env:
          PRIOR_STEPS_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module -e 'import { writeFileSync, readFileSync, existsSync } from "node:fs"; import { createHash } from "node:crypto"; const hash = path => existsSync(path) ? createHash("sha256").update(readFileSync(path)).digest("hex") : null; writeFileSync("deployment-source.json", JSON.stringify({ recordType: "deployment-attempt", priorStepsStatus: process.env.PRIOR_STEPS_STATUS, artifactSha256: hash("deployment-inputs.tgz"), runtimeConfigSha256: hash("frontend/js/config.js"), region: process.env.AWS_REGION, stack: process.env.STACK_NAME, sourceSha: process.env.SOURCE_SHA, tag: process.env.RELEASE_TAG, runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, workflowSha: process.env.GITHUB_WORKFLOW_SHA }, null, 2));'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: deployment-source-${{ github.run_attempt }}
          path: deployment-source.json
          retention-days: 90
