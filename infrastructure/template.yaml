AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless infrastructure for Hengmin Tsao's portfolio.

Parameters:
  PrimaryDomainName:
    Type: String
    Default: henry-tsao.com
    AllowedPattern: '[a-z0-9]+([.-][a-z0-9]+)*\.[a-z]{2,}'
    Description: Primary public hostname; www redirects here and CORS allows this HTTPS origin.
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:412381749585:certificate/97d2f497-56d5-48ed-bd7a-20c48f92d467
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+'
    Description: Existing issued ACM certificate in us-east-1 covering the primary hostname and www.
  NotificationEmail:
    Type: String
    Default: ''
    Description: Optional email address to subscribe to contact notifications.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref ContactTable
        TOPIC_ARN: !Ref ContactTopic
        ALLOWED_ORIGIN: !Sub https://${PrimaryDomainName}

Resources:
  ContactApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${PrimaryDomainName}
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src/handler.handler
      Description: Validates and stores portfolio contact submissions.
      Events:
        SubmitContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContactApi
            Path: /contact
            Method: POST
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ContactTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ContactTopic.TopicName
        - Statement:
            - Effect: Allow
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub sns.${AWS::Region}.${AWS::URLSuffix}
                  kms:EncryptionContext:aws:sns:topicArn: !Ref ContactTopic

  ContactFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ContactFunction}
      RetentionInDays: 30

  ContactFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Portfolio contact Lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ContactFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ContactTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ContactTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns

  ContactEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref ContactTopic

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  CanonicalDomainRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-canonical-domain
      AutoPublish: true
      Tags:
        - Key: Project
          Value: portfolio-aws
      FunctionConfig:
        Comment: Redirect www to the primary HTTPS domain while preserving path and query.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var primaryDomain = '${PrimaryDomainName}';
          if (request.headers.host.value.toLowerCase() !== 'www.' + primaryDomain) {
            return request;
          }
          var query = [];
          var parameters = request.querystring || {};
          for (var key in parameters) {
            var values = parameters[key].multiValue || [parameters[key]];
            for (var i = 0; i < values.length; i++) {
              query.push(key + '=' + values[i].value);
            }
          }
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: 'https://' + primaryDomain + request.uri + (query.length ? '?' + query.join('&') : '') }
            }
          };
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref PrimaryDomainName
          - !Sub www.${PrimaryDomainName}
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref FrontendResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalDomainRedirect.FunctionMetadata.FunctionARN

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiEndpoint:
    Description: Contact form endpoint.
    Value: !Sub https://${ContactApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/contact
  FrontendBucketName:
    Description: Private S3 bucket used by CloudFront.
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref FrontendDistribution
  WebsiteUrl:
    Description: HTTPS portfolio URL.
    Value: !Sub https://${PrimaryDomainName}
  CloudFrontUrl:
    Description: CloudFront distribution hostname for DNS alias targets.
    Value: !Sub https://${FrontendDistribution.DomainName}
